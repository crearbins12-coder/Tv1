name: Build TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar web
        run: |
          find . -maxdepth 2 -not -path './.git/*' -not -path './node_modules/*'
          HTML=$(find . -name '*.html' -not -path './node_modules/*' | head -n 1)
          if [ -z "$HTML" ]; then echo "NO HAY ARCHIVO HTML EN EL REPOSITORIO"; exit 1; fi
          echo "Usando: $HTML"
          npm init -y
          npm i hls.js@1.5.13 mpegts.js@1.7.3
          A=tvapp/app/src/main/assets
          mkdir -p $A tvapp/app/src/main/java/com/tuapp/tvm3u
          cp "$HTML" $A/index.html
          cp node_modules/hls.js/dist/hls.min.js $A/hls.min.js
          cp node_modules/mpegts.js/dist/mpegts.js $A/mpegts.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js#hls.min.js#' $A/index.html
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/mpegts.js/1.7.3/mpegts.js#mpegts.js#' $A/index.html
      - name: Crear proyecto Android
        run: |
          cd tvapp
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TvM3U"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.tuapp.tvm3u'
            compileSdk 34
            defaultConfig {
              applicationId 'com.tuapp.tvm3u'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <application android:label="TV M3U" android:icon="@android:drawable/sym_def_app_icon" android:banner="@android:drawable/sym_def_app_icon" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|uiMode|smallestScreenSize|screenLayout">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/tuapp/tvm3u/MainActivity.java <<'EOF'
          package com.tuapp.tvm3u;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              w = new WebView(this);
              setContentView(w);
              w.setBackgroundColor(0xFF000000);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(true);
              s.setAllowUniversalAccessFromFileURLs(true);
              s.setAllowFileAccessFromFileURLs(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              w.setWebChromeClient(new WebChromeClient());
              w.setWebViewClient(new WebViewClient());
              w.loadUrl("file:///android_asset/index.html");
            }
            @Override public void onBackPressed() {
              w.evaluateJavascript("window.tvBack&&window.tvBack()", v -> {
                if (!"true".equals(v)) finish();
              });
            }
          }
          EOF
      - name: Compilar APK
        run: cd tvapp && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tv-m3u-apk
          path: tvapp/app/build/outputs/apk/debug/app-debug.apk
