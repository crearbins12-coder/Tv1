name: Build TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar proyecto
        run: |
          echo "Archivos del repositorio:"
          find . -maxdepth 2 -not -path './.git/*' -not -path './node_modules/*'
          HTML=$(find . -name '*.html' -not -path './node_modules/*' | head -n 1)
          if [ -z "$HTML" ]; then echo "NO HAY ARCHIVO HTML EN EL REPOSITORIO"; exit 1; fi
          echo "Usando: $HTML"
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 hls.js@1.5.13
          mkdir -p www
          cp "$HTML" www/index.html
          cp node_modules/hls.js/dist/hls.min.js www/hls.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js#hls.min.js#' www/index.html
          echo '{"appId":"com.tuapp.tvm3u","appName":"TV M3U","webDir":"www","server":{"androidScheme":"http","cleartext":true},"plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
      - name: Crear Android y ajustar para TV
        run: |
          npx cap add android
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          s=s.replace('<application','<uses-feature android:name="android.software.leanback" android:required="false"/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n    <application android:usesCleartextTraffic="true" android:banner="@mipmap/ic_launcher"',1)
          s=s.replace('<category android:name="android.intent.category.LAUNCHER" />','<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />',1)
          assert 'LEANBACK_LAUNCHER' in s and 'leanback' in s
          open(p,'w').write(s)
          PY
          npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tv-m3u-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
